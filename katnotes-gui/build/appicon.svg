<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Source for appicon.png, windows/icon.ico and darwin/icons.icns.
       The outside matches katdown's icon; the inside is a spiral notebook. -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="#1a1b26"/>
  <g fill="none" stroke="#6d28d9" stroke-width="26" stroke-linejoin="miter">
    <!-- Cat head: round face with two pointed ears. -->
    <path d="M512 846
             C330 846 208 756 208 606
             C208 520 230 452 262 404
             L248 196
             L420 312
             C450 304 480 300 512 300
             C544 300 574 304 604 312
             L776 196
             L762 404
             C794 452 816 520 816 606
             C816 756 694 846 512 846 Z"/>
  </g>
  <g fill="none" stroke="#15803d" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spiral notebook: page, rings down the left, three lines of text. -->
    <path d="M384 420 H652 V752 H384 Z"/>
    <path d="M356 476 H408 M356 548 H408 M356 620 H408 M356 692 H408"/>
    <path d="M460 520 H600 M460 600 H600 M460 680 H560"/>
